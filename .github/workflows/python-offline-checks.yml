name: Python offline checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/model-route-failover
      - feature/emotional-companion
      - feature/member-memory-fangyi-skill

jobs:
  test-agent-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Agent V2 and legacy bridges
        run: python -m compileall -q src/zhuangfy/agent_v2 SenseVoice/qq_bridge.py SenseVoice/chat_worker.py SenseVoice/turn_planner.py
      - name: Agent V2 offline tests (auto-discover)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -v -s tests/unit -p 'test_agent_v2_*.py'
  test-context-and-qq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries for headless image tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install minimal test dependencies
        run: python -m pip install "websockets==17.2" "PySide6>=6.8,<6.11"
      - name: Compile Python modules
        run: python -m compileall -q SenseVoice
      - name: Offline tests without real LLM or OneBot
        working-directory: SenseVoice
        run: python -m unittest -v test_emotion test_dialogue_context test_turn_planner test_llm test_model_routes test_qq_bridge test_qq_reply_formatter test_member_memory test_fangyi_skill test_gpt_sovits test_activity_log

  test-model-routes-gui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt test dependency
        run: python -m pip install "PySide6>=6.8,<6.11"
      - name: Check API route settings GUI without opening a window
        working-directory: SenseVoice
        run: python -m unittest -v test_model_routes_gui

  test-voice-turn-gui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless voice loop test dependencies
        run: python -m pip install "PySide6>=6.8,<6.12" "numpy>=2.0,<3" "sounddevice>=0.5,<0.6" "sherpa-onnx==1.13.7"
      - name: Qt continuous speech and Voice V1 regression
        working-directory: SenseVoice
        run: python -m unittest -v test_voice_loop

  test-memory-vector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qdrant integration dependency
        run: python -m pip install "qdrant-client==1.19.1"
      - name: Compile Memory Core
        run: python -m compileall -q src/zhuangfy/memory
      - name: Offline memory tests and real Qdrant Local integration
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.unit.test_memory_vector tests.integration.test_memory_qdrant

  test-relationship-r1b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: R1-B relationship evidence and user control tests (offline)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zhuangfy/relationship scripts/relationship_admin.py scripts/character_e12_private_trace.py
          python -m unittest -v tests.unit.test_relationship_core_r1b tests.unit.test_relationship_evolution_r1c tests.unit.test_relationship_evaluation_r1e tests.unit.test_relationship_admin_cli

  test-memory-identity-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M1 compile and identity/Timeline tests (offline)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zhuangfy/memory
          python -m unittest -v tests.unit.test_memory_identity_timeline

  test-memory-curator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M2 offline curator and evidence validation
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zhuangfy/memory
          python -m unittest -v tests.unit.test_memory_curator

  test-memory-hybrid-rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test hybrid RAG (SQLite FTS5, fake embedding and vector index)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zhuangfy/memory
          python -m unittest -v tests.unit.test_memory_hybrid_rag

  test-memory-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile memory and legacy channel adapters
        run: |
          python -m compileall -q src/zhuangfy/memory
          python -m compileall -q SenseVoice/qq_bridge.py SenseVoice/chat_worker.py SenseVoice/gui.py
      - name: In-process authenticated HTTP + identity tests
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.integration.test_memory_http

  test-memory-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M5 admin API, evidence/erasure/evaluation offline tests
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zhuangfy/memory src/zhuangfy/ui/memory_manager.py
          python -m unittest -v tests.integration.test_memory_admin

  test-memory-manager-gui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt
        run: python -m pip install "PySide6>=6.8,<6.12"
      - name: Offline memory manager UI smoke test
        run: python -m unittest -v tests.unit.test_memory_manager_gui

  test-character-e1-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Character E1 synthetic dataset and reporting tests
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.unit.test_agent_v2_character_e1
      - name: Generate E1 reproducible demo report (NOT model performance)
        run: |
          python scripts/character_e1_report.py --out build/character-e1-report --require-full --fail-on-hard
          cat build/character-e1-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E1 human-review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: character-e1-demo-report
          path: build/character-e1-report/
          retention-days: 30
          if-no-files-found: error

  test-hybrid-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate engine switching and privacy boundaries (offline)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q scripts/chat_engine.py scripts/hybrid_probe.py scripts/maisaka_native_experiment.py src/zhuangfy/engine_fusion SenseVoice/hybrid_qq_bridge.py
          python -m unittest -v tests.unit.test_chat_engine_switch tests.unit.test_maisaka_native_experiment tests.unit.test_shared_engine_context tests.unit.test_hybrid_ipc tests.unit.test_native_maisaka_adapter tests.unit.test_hybrid_native_images tests.unit.test_native_image_manager_adapter
