name: Python offline checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/model-route-failover
      - feature/emotional-companion
      - feature/member-memory-fangyi-skill

jobs:
  test-context-and-qq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "websockets==17.2"
      - name: Compile Python modules
        run: python -m compileall -q SenseVoice
      - name: Offline tests without real LLM or OneBot
        working-directory: SenseVoice
        run: python -m unittest -v test_emotion test_dialogue_context test_turn_planner test_llm test_model_routes test_qq_bridge test_qq_reply_formatter test_member_memory test_fangyi_skill test_gpt_sovits test_activity_log

  test-model-routes-gui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt test dependency
        run: python -m pip install "PySide6>=6.8,<6.11"
      - name: Check API route settings GUI without opening a window
        working-directory: SenseVoice
        run: python -m unittest -v test_model_routes_gui

  test-memory-vector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qdrant integration dependency
        run: python -m pip install "qdrant-client==1.19.1"
      - name: Compile Memory Core
        run: python -m compileall -q src/zhuangfy/memory
      - name: Offline memory tests and real Qdrant Local integration
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.unit.test_memory_vector tests.integration.test_memory_qdrant

  test-memory-identity-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M1 compile and identity/Timeline tests (offline)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zhuangfy/memory
          python -m unittest -v tests.unit.test_memory_identity_timeline

  test-memory-curator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M2 offline curator and evidence validation
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zhuangfy/memory
          python -m unittest -v tests.unit.test_memory_curator
