name: Python offline checks

on:
  pull_request:
  push:
    branches:
      - feature/emotional-companion
      - feature/member-memory-fangyi-skill

jobs:
  test-context-and-qq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "websockets==17.2"
      - name: Compile Python modules
        run: python -m compileall -q SenseVoice
      - name: Offline tests without real LLM or OneBot
        working-directory: SenseVoice
        run: python -m unittest -v test_emotion test_dialogue_context test_turn_planner test_llm test_qq_bridge test_member_memory test_fangyi_skill
